<div class="page-header">
    <h1 class="page-title">Контакты</h1>
</div>
<div class="content-grid">
    <div class="col-form">
        <div class="card">
            <form action="/contacts" method="POST">
                <div class="form-group"><label class="form-label">Имя</label><input type="text" class="form-control" name="name" required></div>
                <div class="form-group"><label class="form-label">Почта</label><div class="input-group"><span class="input-group-text">@</span><input type="email" class="form-control" name="email" required></div></div>
                <div class="form-group"><label class="form-label">Сообщение</label><textarea class="form-control" name="message" rows="5" required></textarea></div>
                <button type="submit" class="btn-buy" style="background:#2f6bf2; color:#fff; border:none;">Отправить</button>
            </form>
        </div>
    </div>
    <div class="col-text">
        <h2 class="text-title" style="margin-top:0;">Наши контакты</h2>

    </div>
</div>
